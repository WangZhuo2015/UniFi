[package]
name = "unifi"
version = "0.1.0"
description = "Cross-platform WiFi analysis tool"
authors = ["you"]
edition = "2021"

[lib]
name = "unifi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "unifi"
path = "src/main.rs"

[[bin]]
name = "unifi-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core
serde = { workspace = true }
serde_json = "1"
hex = "0.4"

# Scanner core
scanner-core = { path = "../crates/scanner-core" }

# CLI
clap = { version = "4", features = ["derive"] }

# GUI (Tauri)
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# macOS scanners
[target.'cfg(target_os = "macos")'.dependencies]
scanner-airport = { path = "../crates/scanner-airport" }
scanner-corewlan = { path = "../crates/scanner-corewlan" }
scanner-libpcap = { path = "../crates/scanner-libpcap" }
plist = "1"
objc = "0.2"
objc-foundation = "0.1"
pcap = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

# Windows scanner
[target.'cfg(target_os = "windows")'.dependencies]
scanner-wlanapi = { path = "../crates/scanner-wlanapi" }
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_WiFi",
    "Win32_Foundation",
] }

# Linux scanners
[target.'cfg(target_os = "linux")'.dependencies]
scanner-nl80211 = { path = "../crates/scanner-nl80211" }
scanner-libpcap = { path = "../crates/scanner-libpcap" }
pcap = "2"
libc = "0.2"

