[package]
name = "wifi-tool"
version = "0.1.0"
description = "Cross-platform WiFi analysis tool"
authors = ["you"]
edition = "2021"

[lib]
name = "wifi_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["lite"]
lite = []
pro = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# macOS WiFi scanning
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

